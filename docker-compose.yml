services:
  db:
    image: ankane/pgvector:latest
    container_name: face_recognition_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: face_recognition
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - face_recognition_network

  # Ensures face_recognition DB exists and schema is applied when the volume was
  # created by an older run (PostgreSQL skips init and does not create the DB).
  db-init:
    image: ankane/pgvector:latest
    container_name: face_recognition_db_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./init.sql:/init.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until psql -U postgres -h db -c 'SELECT 1' 2>/dev/null; do sleep 1; done
        if ! psql -U postgres -h db -d face_recognition -c 'SELECT 1' 2>/dev/null; then
          psql -U postgres -h db -c "CREATE DATABASE face_recognition"
          psql -U postgres -h db -d face_recognition -f /init.sql
          echo "Created database face_recognition and applied schema."
        else
          echo "Database face_recognition already exists."
        fi
    networks:
      - face_recognition_network
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      # Use BuildKit for faster builds
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: face_recognition_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/face_recognition
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - face_recognition_network

  frontend:
    build: ./frontend
    container_name: face_recognition_frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy: frontend container must reach API via service name
      API_BACKEND_URL: http://api:8000
    depends_on:
      - api
    networks:
      - face_recognition_network

volumes:
  postgres_data:

networks:
  face_recognition_network:
    driver: bridge

